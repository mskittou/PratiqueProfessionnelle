<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منظومة رصد وتحليل الممارسات المهنية</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- خط Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Cairo', sans-serif; }
    
    /* ========================================================
       قواعد الطباعة: طباعة الملخص فقط وإخفاء الاستمارة والأزرار
       ======================================================== */
    @media print {
      @page {
        size: A4 portrait;
        margin: 12mm;
      }
      
      /* إخفاء كل العناصر غير المرغوبة أثناء الطباعة */
      .no-print, header, form, #printBtn, #clearBtn, #submitBtn {
        display: none !important;
      }

      body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .main-container {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
        width: 100% !important;
      }

      #outputSection {
        display: block !important;
        border: none !important;
        padding-top: 0 !important;
        margin-top: 0 !important;
      }

      #printableCard {
        border: 1px solid #94a3b8 !important;
        box-shadow: none !important;
        padding: 16px !important;
        margin: 0 auto !important;
        width: 100% !important;
        display: block !important;
        visibility: visible !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen py-8 px-4 sm:px-6">

  <div class="main-container max-w-4xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-200 p-6 sm:p-10">
    
    <!-- الشعار في أعلى الصفحة (الاستمارة) -->
    <div class="no-print flex justify-center mb-4">
      <img src="./logo.png" alt="شعار المؤسسة" class="h-20 sm:h-24 w-auto object-contain">
    </div>

    <!-- رأس الصفحة -->
    <header class="border-b border-slate-200 pb-6 mb-8 text-center no-print">
      <span class="inline-block px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-semibold tracking-wide mb-2">
        تحليل الممارسات المهنية والتبصر الإداري
      </span>
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">بطاقة رصد حالة مهنية للتحليل التبصري الجماعي</h1>
      <p class="text-sm text-slate-500 mt-2">
        خاص بالمتدربين بالمصالح المركزية، الأكاديميات الجهوية للتربية والتكوين، والمديريات الإقليمية
      </p>
    </header>

    <form id="practiceForm" class="space-y-8 no-print">

      <!-- القسم 1: المعطيات العامة والسياقية -->
      <section class="bg-slate-50 rounded-xl p-5 border border-slate-200">
        <h2 class="text-lg font-bold text-blue-900 mb-4 flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs">1</span>
          المعطيات العامة والسياقية المباشرة
        </h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-1">الاسم الكامل للمتدرب(ة):</label>
            <input type="text" id="traineeName" required class="w-full rounded-lg border-slate-300 border p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">مقر التدريب:</label>
            <select id="trainingLocationType" class="w-full rounded-lg border-slate-300 border p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="المديرية الإقليمية">المديرية الإقليمية</option>
              <option value="الأكاديمية الجهوية (AREF)">الأكاديمية الجهوية للتربية والتكوين (AREF)</option>
              <option value="الإدارة المركزية (الوزارة)">مصالح الإدارة المركزية (الوزارة)</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">اسم المصلحة / القسم / المكتب:</label>
            <input type="text" id="departmentName" placeholder="مثال: مصلحة التخطيط والخريطة المدرسية" required class="w-full rounded-lg border-slate-300 border p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">تاريخ وتوقيت الواقعة:</label>
            <div class="grid grid-cols-2 gap-2">
              <input type="date" id="eventDate" required class="w-full rounded-lg border-slate-300 border p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <select id="eventPeriod" class="w-full rounded-lg border-slate-300 border p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="صباحاً">صباحاً</option>
                <option value="بعد الزوال">بعد الزوال</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">ظرفية العمل:</label>
            <select id="workloadContext" class="w-full rounded-lg border-slate-300 border p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="فترة عادية">فترة عمل عادية</option>
              <option value="فترة ذروة وضغط موسمي">فترة ذروة / ضغط عمل موسمي (دخول مدرسي، امتحانات، إعداد الميزانية...)</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">المكان الدقيق للواقعة:</label>
            <select id="exactLocation" class="w-full rounded-lg border-slate-300 border p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="مكتب العمل الشخصي">مكتب العمل الشخصي</option>
              <option value="مكتب الرئيس المباشر">مكتب الرئيس المباشر</option>
              <option value="قاعة اجتماعات">قاعة اجتماعات</option>
              <option value="شباك استقبال / فضاء تواصل خارجي">شباك استقبال / فضاء تواصل خارجي</option>
              <option value="زيارة ميدانية لمؤسسة">زيارة ميدانية لمؤسسة تعليمية</option>
            </select>
          </div>
        </div>

        <div class="mt-4">
          <label class="block text-sm font-semibold mb-2">الأطراف المتدخلة في الموقف (اختر كل من شارك أو حضر):</label>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-sm">
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="stakeholders" value="الرئيس المباشر" class="rounded text-blue-600"> الرئيس المباشر</label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="stakeholders" value="زميل موظف" class="rounded text-blue-600"> زميل موظف / إطار إداري</label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="stakeholders" value="مفتش تربوي/إداري" class="rounded text-blue-600"> مرشد / مفتش تربوي أو إداري</label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="stakeholders" value="مدير مؤسسة تعليمية" class="rounded text-blue-600"> مدير مؤسسة تعليمية</label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="stakeholders" value="أستاذ / إطار تدريس" class="rounded text-blue-600"> أستاذ / إطار تعليمي</label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="stakeholders" value="مرتفق خارجي" class="rounded text-blue-600"> مرتفق خارجي (ولي أمر، نقابي...)</label>
          </div>
        </div>
      </section>

      <!-- القسم 2: طبيعة النشاط والمجال الإداري -->
      <section class="bg-slate-50 rounded-xl p-5 border border-slate-200">
        <h2 class="text-lg font-bold text-blue-900 mb-4 flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs">2</span>
          طبيعة النشاط والمجال الإداري
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-1">المجال الوظيفي الرئيسي للوضعية:</label>
            <select id="functionalField" class="w-full rounded-lg border-slate-300 border p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="التخطيط والخريطة المدرسية">التخطيط والخريطة المدرسية والتوقعات</option>
              <option value="التدبير المالي والمادي والصفقات">التدبير المالي والمادي والمحاسباتي والصفقات</option>
              <option value="تدبير الموارد البشرية">تدبير الموارد البشرية والوضعيات الإدارية</option>
              <option value="الشؤون التربوية وتتبع المشاريع">الشؤون التربوية وتتبع المشاريع والبرامج</option>
              <option value="الشؤون القانونية والمنازعات والشكايات">الشؤون القانونية والمنازعات والشكايات</option>
              <option value="الإعلام والتواصل والاستقبال">الإعلام، التواصل، واستقبال المرتفقين</option>
              <option value="تدبير المنظومات الرقمية وقواعد البيانات">تدبير المنظومات الرقمية (مسار، ESISE...)</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">طبيعة المهمة قيد الإنجاز:</label>
            <select id="taskNature" class="w-full rounded-lg border-slate-300 border p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="معالجة ملف إداري فردي">معالجة ملف إداري فردي</option>
              <option value="صياغة مراسلة أو تقرير إداري">صياغة مراسلة / تقرير إداري</option>
              <option value="اجتماع تنسيقي أو تدبيري">اجتماع تنسيقي أو تدبيري</option>
              <option value="استقبال ومعالجة شكاية">استقبال ومعالجة شكاية</option>
              <option value="استخراج وتدقيق معطيات إحصائية">استخراج وتدقيق معطيات إحصائية</option>
              <option value="إعداد ميزانية أو جداول التسيير">إعداد ميزانية أو جداول التسيير</option>
            </select>
          </div>
        </div>
      </section>

      <!-- القسم 3: توصيف عناصر الوضعية -->
      <section class="bg-slate-50 rounded-xl p-5 border border-slate-200">
        <h2 class="text-lg font-bold text-blue-900 mb-4 flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs">3</span>
          توصيف عناصر الوضعية والإحراج المهني
        </h2>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold mb-1">1. الهدف الإداري المسبق (سطر واحد):</label>
            <input type="text" id="intendedGoal" placeholder="ما هي النتيجة التي كان يفترض الوصول إليها؟" required class="w-full rounded-lg border-slate-300 border p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">2. طبيعة الحدث المباغت / المشكل الفعلي:</label>
            <select id="suddenEventType" class="w-full rounded-lg border-slate-300 border p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none mb-2">
              <option value="تعارض بين نص قانوني ومقتضيات الميدان">تعارض بين نص قانوني/مذكرة وواقع الميدان</option>
              <option value="ضغط وقت مفاجئ واستعجال غير مبرر">ضغط وقت مفاجئ / استعجال غير مبرر</option>
              <option value="خطأ وتضارب في المعطيات أو الوثائق">خطأ أو تضارب في المعطيات الإحصائية أو الوثائق</option>
              <option value="مقاومة للتغيير أو رفض تعليمات">مقاومة للتغيير أو رفض تنفيذ تعليمات</option>
              <option value="توتر
